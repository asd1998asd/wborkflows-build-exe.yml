name: Build MyTool EXE

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter pyinstaller

      - name: Download ADB and Fastboot
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "platform-tools.zip"
          Expand-Archive -Path "platform-tools.zip" -DestinationPath "." -Force

      - name: Build Standalone EXE
        run: |
          pyinstaller --noconsole --onefile --clean --collect-all customtkinter --add-binary "platform-tools/adb.exe;." --add-binary "platform-tools/fastboot.exe;." --add-binary "platform-tools/AdbWinApi.dll;." --add-binary "platform-tools/AdbWinUsbApi.dll;." --name "MyTool_v2" main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MyTool_v2-Windows
          path: dist/MyTool_v2.exe
